name: Vulnerability scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on Mondays at 09:23 UTC (off the :00 stampede).
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # govulncheck type-checks the packages it scans, so the CGo
      # binding's shared library must exist first.
      - name: Build shared library
        run: make lib

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
          # The action checks out the repo itself by default, and that
          # checkout git-cleans the workspace — deleting the gitignored
          # build/ tree the step above just built. We did the checkout.
          repo-checkout: false